server {
    listen 80 reuseport default_server;
    listen [::]:80 reuseport default_server;
    listen 443 ssl reuseport default_server;
    listen [::]:443 ssl reuseport default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;
    
    server_name _;

    # Requires Nginx >= 1.29.3.
    add_header_inherit merge;

    # SSL 证书配置
    ssl_certificate /etc/nginx/certs/default_server.crt;
    ssl_certificate_key /etc/nginx/certs/default_server.key;

    # 返回 444 状态码以丢弃无效请求
    return 444;
}

# Direct mode: do not trust client-supplied forwarding headers.
# Custom reverse proxies must declare their exact CIDRs and header explicitly.
